    <text x="210" y="720" fill="#94a3b8" font-size="11">• Điểm cân bằng tối ưu giữa Tốc độ &amp; Độ chính xác (Sweet Spot) là <tspan fill="#a855f7">Distil-Text NLP (91.5% Acc, 45ms)</tspan> và <tspan fill="#38bdf8">GBDT (89.2% Acc, 12.4ms)</tspan>.</text>
    
