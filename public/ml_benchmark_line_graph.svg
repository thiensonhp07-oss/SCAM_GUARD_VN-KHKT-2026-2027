<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background-color:#0b0f19; font-family: system-ui, -apple-system, sans-serif;">

    <defs>
        <linearGradient id="accGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="f1Grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="aucGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#eab308" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#eab308" stop-opacity="0.0"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    

    <rect x="30" y="20" width="1140" height="70" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
    <text x="50" y="50" fill="#f8fafc" font-size="20" font-weight="800">PHÂN TÍCH DIỄN TIẾN HIỆU NĂNG MACHINE LEARNING (ML BENCHMARK LINE GRAPH)</text>
    <text x="50" y="72" fill="#94a3b8" font-size="13">So sánh Accuracy, F1-Score, ROC-AUC (%) và Độ trễ suy luận trên 6 kiến trúc mô hình</text>
    

    <rect x="60" y="70" width="1080" height="580" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
    
